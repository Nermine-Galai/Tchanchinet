<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="اختاروا أساميكم وابدأوا تحدّي التشنشينات: سؤال للاعب الأول وسؤال للاعب الثاني.">
  <title>تشنشينات — تحضير التحدّي</title>
  <link rel="preload" as="image" href="assests/bg.4afab73f46.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="versus.css">
</head>
<body class="versus-page">
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <div class="game-screen">
    <header class="game-header">
      <a class="brand" href="index.html" aria-label="تشنشينات، الصفحة الرئيسية"><img src="assests/tchanchinet_logo.c576f576c8.webp" alt="تشنشينات" width="1516" height="470"></a>
    </header>
    <main id="main" class="versus-main">
      <form id="players-form" action="versus-quiz.html" method="get">
        <input type="hidden" name="mode" value="versus">
        <section class="ornament-panel rules-panel setup-panel" aria-labelledby="setup-title">
          <img fetchpriority="high" class="panel-art" src="assests/rules_box.2c1fac0e9b.webp" alt="" width="2172" height="724">
          <div class="panel-content setup-content">
            <h1 id="setup-title">شكون باش يتحدّى شكون؟</h1>
            <p id="setup-help">اكتبوا أساميكم. كل واحد يجاوب على سؤال، بالتناوب.</p>
            <div class="player-fields">
              <fieldset class="player-card player-blue">
                <legend><span class="player-dot" aria-hidden="true"></span> اللاعب الأول</legend>
                <label for="player-one-name">اسم اللاعب الأول</label>
                <input id="player-one-name" name="player1" type="text" dir="auto" placeholder="اكتب اسمك هنا…" maxlength="24" pattern=".*\S.*" autocomplete="off" required aria-describedby="setup-help">
              </fieldset>
              <fieldset class="player-card player-gold">
                <legend><span class="player-dot" aria-hidden="true"></span> اللاعب الثاني</legend>
                <label for="player-two-name">اسم اللاعب الثاني</label>
                <input id="player-two-name" name="player2" type="text" dir="auto" placeholder="واسم المنافس؟" maxlength="24" pattern=".*\S.*" autocomplete="off" required aria-describedby="setup-help">
              </fieldset>
            </div>
          </div>
        </section>
        <div class="page-actions setup-actions">
          <button id="start-versus" class="game-button" type="submit">ابدأوا التحدّي</button>
          <a class="setup-back" href="index.html">العودة للصفحة الرئيسية</a>
        </div>
      </form>
      <p class="setup-note">سؤال للاعب الأول، وبعده سؤال للاعب الثاني. نفس الفرص للزوز!</p>
    </main>
  </div>
</body>
</html>
