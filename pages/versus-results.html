<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="نتيجة تحدّي التشنشينات: نقاط كل لاعب وشكون ربح.">
  <title>تشنشينات — نتيجة التحدّي</title>
  <link rel="preload" as="image" href="../assets/bg.4afab73f46.webp" type="image/webp">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/versus-results.css">
</head>
<body class="versus-results-page">
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <!-- data-winner: pending (placeholder), 1, 2 or draw. JavaScript fills the names and scores. -->
  <div id="versus-result" class="game-screen" data-winner="pending">
    <header class="game-header">
      <a class="brand" href="../index.html" aria-label="تشنشينات، الصفحة الرئيسية"><img src="../assets/tchanchinet_logo.c576f576c8.webp" alt="تشنشينات" width="1516" height="470"></a>
    </header>
    <main id="main" class="versus-results-main">
      <section class="ornament-panel rules-panel duel-result-panel" aria-labelledby="result-title">
        <img fetchpriority="high" class="panel-art" src="../assets/rules_box.2c1fac0e9b.webp" alt="" width="2172" height="724">
        <div class="panel-content duel-result-content">
          <h1 id="result-title">يعطيكم الصحة!</h1>
          <div id="winner-announcement" class="winner-announcement" role="status" aria-live="polite" aria-atomic="true">
            <p class="winner-pending">هنا تظهر نتيجة التحدّي وشكون ربح.</p>
            <p class="winner-one">مبروك لـ <bdi id="winner-one-name">اللاعب الأول</bdi>، ربحت التحدّي!</p>
            <p class="winner-two">مبروك لـ <bdi id="winner-two-name">اللاعب الثاني</bdi>، ربحت التحدّي!</p>
            <p class="winner-draw">تعادل! الزوز قدّ التحدّي.</p>
          </div>
          <div class="duel-results-grid">
            <section id="player-one-result" class="player-card player-blue result-player" aria-labelledby="player-one-result-name">
              <h2 id="player-one-result-name">اللاعب الأول</h2>
              <p class="duel-final-score"><span id="player-one-final-score">—</span><span>نقطة</span></p>
              <p class="winner-badge winner-one">الفائز</p>
              <p class="draw-badge winner-draw">تعادل</p>
            </section>
            <section id="player-two-result" class="player-card player-gold result-player" aria-labelledby="player-two-result-name">
              <h2 id="player-two-result-name">اللاعب الثاني</h2>
              <p class="duel-final-score"><span id="player-two-final-score">—</span><span>نقطة</span></p>
              <p class="winner-badge winner-two">الفائز</p>
              <p class="draw-badge winner-draw">تعادل</p>
            </section>
          </div>
        </div>
      </section>
      <nav class="page-actions" aria-label="بعد نهاية التحدّي">
        <a id="return-home" class="game-button" href="../index.html">العودة إلى الصفحة الرئيسية</a>
      </nav>
    </main>
  </div>
<script src="../js/versus-results.js" defer></script>
</body>
</html>
